apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fl-prod
resources:
  - ../../../apps/nginx
patches:
  - target:
      kind: Deployment
      name: fl-nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: fl-nginx
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod-nginx.fl.local