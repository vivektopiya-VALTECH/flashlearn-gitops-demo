apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fl-prod
resources:
  - ../../../apps/echo
patches:
  - target:
      kind: Deployment
      name: fl-echo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: fl-echo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod-echo.fl.local