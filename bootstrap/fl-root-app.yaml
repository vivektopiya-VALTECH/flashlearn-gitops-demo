apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fl-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vivektopiya-VALTECH/flashlearn-gitops-demo.git
    targetRevision: main
    path: app-of-apps/children
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true