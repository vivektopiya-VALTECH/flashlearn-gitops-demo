apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fl-simple-pod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vivektopiya-VALTECH/flashlearn-gitops-demo.git
    targetRevision: main
    path: workloads/simple-pod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true