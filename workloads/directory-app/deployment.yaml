apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-directory-nginx
  labels:
    app.kubernetes.io/name: fl-nginx
    app.kubernetes.io/instance: fl-directory-nginx
    app.kubernetes.io/part-of: flashlearn-gitops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: fl-directory-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fl-nginx
        app.kubernetes.io/instance: fl-directory-nginx
    spec:
      containers:
        - name: fl-nginx
          image: nginx:1.29.1-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi