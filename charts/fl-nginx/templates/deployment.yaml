apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl-helm-nginx
  labels:
    app.kubernetes.io/name: fl-nginx
    app.kubernetes.io/instance: fl-helm-nginx
    app.kubernetes.io/part-of: flashlearn-gitops-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: fl-helm-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fl-nginx
        app.kubernetes.io/instance: fl-helm-nginx
    spec:
      containers:
        - name: fl-nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}